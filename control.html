<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Control TV</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #111;

      color: white;

    }


    .contenedor {

      width: 100%;

      max-width: 500px;

      margin: 0 auto;

    }


    h1 {

      text-align: center;

      font-size: 28px;

      margin:
        10px
        0
        5px
        0;

    }


    .subtitulo {

      text-align: center;

      color: #999;

      margin-bottom: 25px;

    }


    .tv {

      background: #1e1e1e;

      border-radius: 18px;

      padding: 20px;

    }


    .tv-header {

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      margin-bottom: 20px;

    }


    .tv-nombre {

      font-size: 22px;

      font-weight: bold;

    }


    .estado {

      font-size: 13px;

      color: #00d26a;

    }


    .botones {

      display: grid;

      gap: 14px;

    }


    button {

      width: 100%;

      min-height: 70px;

      border: none;

      border-radius: 14px;

      color: white;

      font-size: 19px;

      font-weight: bold;

      cursor: pointer;

    }


    button:active {

      transform: scale(0.98);

    }


    .video1 {

      background: #1769aa;

    }


    .video2 {

      background: #7b3fb5;

    }


    .resultado {

      margin-top: 20px;

      padding: 16px;

      border-radius: 12px;

      background: #292929;

      text-align: center;

      min-height: 55px;

      display: flex;

      justify-content: center;

      align-items: center;

    }


    .info {

      margin-top: 20px;

      padding: 15px;

      border-radius: 12px;

      background: #181818;

      color: #888;

      font-size: 13px;

      line-height: 1.6;

    }

  </style>

</head>


<body>


<div class="contenedor">


  <h1>
    CONTROL DE PANTALLAS
  </h1>


  <div class="subtitulo">
    Sistema de reproducción centralizada
  </div>


  <div class="tv">


    <div class="tv-header">

      <div class="tv-nombre">
        📺 TV-01
      </div>


      <div
        id="estado"
        class="estado"
      >
        ● LISTA
      </div>

    </div>


    <div class="botones">


      <button
        class="video1"
        onclick="
          enviarVideo('video01.mp4')
        "
      >
        ▶ VIDEO 01
      </button>


      <button
        class="video2"
        onclick="
          enviarVideo('video02.mp4')
        "
      >
        ▶ VIDEO 02
      </button>


    </div>


    <div
      id="resultado"
      class="resultado"
    >
      Selecciona un video
    </div>


  </div>


  <div class="info">

    <strong>TV:</strong>
    TV-01

    <br>

    <strong>Servidor:</strong>
    Google Apps Script

    <br>

    <strong>Comunicación:</strong>
    Central

  </div>


</div>



<script>


/* ========================================================
   CONFIGURACIÓN
   ======================================================== */


const TV_ID =
  "TV-01";


const COMMAND_URL =
  "https://script.google.com/macros/s/AKfycby1pMrCtWRBlGjY6XCO5SbSqAynFUARkKcEjVwXYsBbbC3jeInHMnEZe9tAQBUHUII1kw/exec";


const resultado =
  document.getElementById(
    "resultado"
  );


const estado =
  document.getElementById(
    "estado"
  );


/* ========================================================
   ENVIAR VIDEO
   ======================================================== */

function enviarVideo(video) {


  resultado.innerHTML =
    "Enviando orden...";


  estado.innerHTML =
    "● ENVIANDO";


  const callback =
    "respuesta_" +
    Date.now();


  /*
   --------------------------------------------------------
   Crear callback
   --------------------------------------------------------
  */

  window[callback] =
    function(data) {


      console.log(
        "Respuesta central:",
        data
      );


      if (
        data &&
        data.ok === true
      ) {


        resultado.innerHTML =
          "✓ CENTRAL RECIBIÓ LA ORDEN";


        estado.innerHTML =
          "● CONECTADA";


      } else {


        resultado.innerHTML =
          "✕ ERROR EN LA CENTRAL";


        estado.innerHTML =
          "● ERROR";

      }


      delete window[callback];

    };


  /*
   --------------------------------------------------------
   Crear URL
   --------------------------------------------------------
  */

  const url =
    COMMAND_URL
    + "?tv="
    + encodeURIComponent(
        TV_ID
      )
    + "&video="
    + encodeURIComponent(
        video
      )
    + "&callback="
    + encodeURIComponent(
        callback
      )
    + "&t="
    + Date.now();


  console.log(
    "ORDEN:",
    url
  );


  /*
   --------------------------------------------------------
   Crear SCRIPT
   --------------------------------------------------------
  */

  const script =
    document.createElement(
      "script"
    );


  script.src =
    url;


  script.onerror =
    function() {


      resultado.innerHTML =
        "✕ NO SE PUDO CONTACTAR LA CENTRAL";


      estado.innerHTML =
        "● SIN CONEXIÓN";


      delete window[callback];


      script.remove();

    };


  document
    .body
    .appendChild(
      script
    );


  /*
   --------------------------------------------------------
   Timeout
   --------------------------------------------------------
  */

  setTimeout(
    function() {


      script.remove();


      if (
        window[callback]
      ) {


        resultado.innerHTML =
          "⚠ SIN RESPUESTA DE LA CENTRAL";


        estado.innerHTML =
          "● SIN RESPUESTA";


        delete window[callback];

      }


    },
    10000
  );

}


</script>


</body>

</html>
