<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>PLAYER TV</title>

  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: #000;

      overflow: hidden;

    }

    #player {

      position: fixed;

      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      background: #000;

      object-fit: contain;

      display: block;

    }

  </style>

</head>


<body>


<video
  id="player"
  autoplay
  muted
  playsinline
></video>


<script>

/* =========================================================
   CONFIGURACIÓN
   ========================================================= */

/*
   IDENTIFICADOR DE ESTA TV
*/

const TV_ID =
  "TV-01";


/*
   GOOGLE APPS SCRIPT
   CENTRAL DE ÓRDENES
*/

const COMMAND_URL =
  "https://script.google.com/macros/s/AKfycby1pMrCtWRBlGjY6XCO5SbSqAynFUARkKcEjVwXYsBbbC3jeInHMnEZe9tAQBUHUII1kw/exec";


/*
   CLOUDFLARE R2
   SERVIDOR DE VIDEOS
*/

const VIDEO_BASE =
  "https://pub-1efa5f9724f545f287360b07a22fa891.r2.dev/";


/*
   REPRODUCTOR
*/

const player =
  document.getElementById(
    "player"
  );


/*
   ÚLTIMA ORDEN RECIBIDA
*/

let ultimoComando =
  "";


/* =========================================================
   REPRODUCIR VIDEO
   ========================================================= */

function reproducir(
  video,
  id
) {

  const src =
    VIDEO_BASE +
    video +
    "?v=" +
    encodeURIComponent(
      id
    );


  console.log(
    "Reproduciendo:",
    src
  );


  player.src =
    src;


  player.load();


  player.play().catch(
    function(error) {

      console.log(
        "Play pendiente:",
        error
      );

    }
  );

}


/* =========================================================
   CONSULTAR CENTRAL
   ========================================================= */

async function consultar() {

  try {

    const url =
      COMMAND_URL
      + "?tv="
      + encodeURIComponent(
          TV_ID
        )
      + "&t="
      + Date.now();


    const respuesta =
      await fetch(
        url,
        {
          cache:
            "no-store"
        }
      );


    const data =
      await respuesta.json();


    console.log(
      "Central:",
      data
    );


    if (
      data.ok &&
      data.video &&
      data.id !==
        ultimoComando
    ) {

      ultimoComando =
        data.id;


      reproducir(
        data.video,
        data.id
      );

    }

  }

  catch (error) {

    console.log(
      "Sin conexión con central:",
      error
    );

  }

}


/* =========================================================
   LOOP DEL VIDEO
   ========================================================= */

player.addEventListener(
  "ended",
  function() {

    player.currentTime =
      0;


    player.play().catch(
      function() {}
    );

  }
);


/* =========================================================
   INICIO
   ========================================================= */

player.src =
  VIDEO_BASE +
  "video01.mp4";


player.load();


player.play().catch(
  function() {}
);


/*
   Primera consulta
*/

consultar();


/*
   Consultar central
   cada 3 segundos
*/

setInterval(
  consultar,
  3000
);

</script>


</body>

</html>
