<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>PLAYER TV</title>


  <style>

    /* =====================================================
       PANTALLA COMPLETA
       ===================================================== */

    html,
    body {

      margin: 0;

      padding: 0;

      width: 100%;

      height: 100%;

      background: #000;

      overflow: hidden;

    }


    /* =====================================================
       VIDEO
       ===================================================== */

    #player {

      position: fixed;

      top: 0;

      left: 0;

      width: 100vw;

      height: 100vh;

      background: #000;

      object-fit: contain;

      display: block;

    }


  </style>

</head>


<body>


<video
  id="player"
  autoplay
  muted
  playsinline
></video>


<script>


/* =========================================================
   CONFIGURACIÓN
   ========================================================= */


const TV_ID =
  "TV-01";


const COMMAND_URL =
  "https://script.google.com/macros/s/AKfycby1pMrCtWRBlGjY6XCO5SbSqAynFUARkKcEjVwXYsBbbC3jeInHMnEZe9tAQBUHUII1kw/exec";


const BASE =
  "videos/";


const player =
  document.getElementById(
    "player"
  );


let ultimoComando =
  "";


/* =========================================================
   REPRODUCIR VIDEO
   ========================================================= */

function reproducir(video, id) {


  /*
   ---------------------------------------------------------
   Agregamos el ID de la orden como parámetro.

   Esto evita que el TV utilice una versión antigua
   del video guardada en caché.
   ---------------------------------------------------------
  */

  const src =
    BASE +
    video +
    "?v=" +
    encodeURIComponent(id);


  /*
   ---------------------------------------------------------
   Cambiar fuente
   ---------------------------------------------------------
  */

  player.src =
    src;


  /*
   ---------------------------------------------------------
   Reiniciar video
   ---------------------------------------------------------
  */

  player.load();


  /*
   ---------------------------------------------------------
   Reproducir automáticamente
   ---------------------------------------------------------
  */

  player.play().catch(
    function() {}
  );

}


/* =========================================================
   CONSULTAR CENTRAL
   ========================================================= */

async function consultar() {


  try {


    const url =
      COMMAND_URL
      + "?tv="
      + encodeURIComponent(
          TV_ID
        )
      + "&t="
      + Date.now();


    const respuesta =
      await fetch(
        url,
        {
          cache: "no-store"
        }
      );


    const data =
      await respuesta.json();


    console.log(
      "Central:",
      data
    );


    /*
     -------------------------------------------------------
     Si existe una orden nueva
     -------------------------------------------------------
    */

    if (
      data.ok &&
      data.video &&
      data.id !== ultimoComando
    ) {


      ultimoComando =
        data.id;


      reproducir(
        data.video,
        data.id
      );

    }


  } catch (error) {


    /*
     -------------------------------------------------------
     No mostramos ningún error en pantalla.

     El TV queda visualmente limpio.
     -------------------------------------------------------
    */

    console.log(
      "Sin conexión con central:",
      error
    );

  }

}


/* =========================================================
   LOOP DEL VIDEO
   ========================================================= */

player.addEventListener(
  "ended",
  function() {


    /*
     Volver al comienzo
    */

    player.currentTime = 0;


    /*
     Reproducir nuevamente
    */

    player.play().catch(
      function() {}
    );

  }
);


/* =========================================================
   INICIO
   ========================================================= */


/*
   Video inicial
*/

player.src =
  BASE +
  "video01.mp4";


player.load();


player.play().catch(
  function() {}
);


/*
   Primera consulta
*/

consultar();


/*
   Consultar central cada 3 segundos
*/

setInterval(
  consultar,
  3000
);


</script>


</body>

</html>
