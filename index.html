<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player TV Instituto</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
      background: #000;
    }
  </style>
</head>
<body>
  <video id="player"
         autoplay
         muted
         loop
         playsinline
         preload="auto">
    <source src="videos/video01.mp4" type="video/mp4">
    Tu navegador no puede reproducir este video.
  </video>

  <script>
    const player = document.getElementById("player");

    // Intento inicial de reproducción.
    player.play().catch(() => {
      // Algunos televisores exigen una interacción inicial.
      // El video está muted para permitir autoplay cuando sea posible.
    });
  </script>
</body>
</html>
