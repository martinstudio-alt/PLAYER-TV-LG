<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>PLAYER TV</title>


  <style>

    html,
    body {

      margin: 0;

      padding: 0;

      width: 100%;

      height: 100%;

      background: black;

      overflow: hidden;

      font-family: Arial, sans-serif;

    }


    #player {

      width: 100%;

      height: 100%;

      object-fit: contain;

      background: black;

    }


    #estado {

      position: fixed;

      left: 10px;

      bottom: 10px;

      color: white;

      background: rgba(0,0,0,0.65);

      padding: 8px 12px;

      border-radius: 6px;

      font-size: 14px;

      z-index: 10;

    }

  </style>

</head>


<body>


<video
  id="player"
  autoplay
  muted
  playsinline
></video>


<div id="estado">
  Iniciando...
</div>


<script>


/* =========================================================
   CONFIGURACIÓN
   ========================================================= */


const TV_ID =
  "TV-01";


const COMMAND_URL =
  "https://script.google.com/macros/s/AKfycby1pMrCtWRBlGjY6XCO5SbSqAynFUARkKcEjVwXYsBbbC3jeInHMnEZe9tAQBUHUII1kw/exec";


const BASE =
  "videos/";


const player =
  document.getElementById(
    "player"
  );


const estado =
  document.getElementById(
    "estado"
  );


let ultimoComando =
  "";


/* =========================================================
   REPRODUCIR
   ========================================================= */

function reproducir(video) {

  const src =
    BASE + video;


  /*
   Solo cambiar si realmente
   cambió el archivo.
  */

  if (
    player.getAttribute("src")
    !== src
  ) {

    player.src =
      src;

    player.load();

  }


  player.play()

    .then(function() {

      estado.textContent =
        TV_ID +
        " · " +
        video;

    })

    .catch(function(error) {

      estado.textContent =
        TV_ID +
        " · error reproducción";

      console.log(
        "Error reproducción:",
        error
      );

    });

}


/* =========================================================
   CONSULTAR CENTRAL
   ========================================================= */

async function consultar() {


  estado.textContent =
    TV_ID +
    " · consultando central";


  try {


    const url =
      COMMAND_URL
      + "?tv="
      + encodeURIComponent(
          TV_ID
        )
      + "&t="
      + Date.now();


    const respuesta =
      await fetch(
        url,
        {
          cache: "no-store"
        }
      );


    const data =
      await respuesta.json();


    console.log(
      "Central:",
      data
    );


    if (
      data.ok &&
      data.video
    ) {


      /*
       Solo cambiar si la orden
       es nueva.
      */

      if (
        data.id !==
        ultimoComando
      ) {

        ultimoComando =
          data.id;


        reproducir(
          data.video
        );

      } else {

        estado.textContent =
          TV_ID +
          " · " +
          data.video;

      }

    }


  } catch (error) {


    console.log(
      "Error central:",
      error
    );


    estado.textContent =
      TV_ID +
      " · sin conexión";

  }

}


/* =========================================================
   INICIO
   ========================================================= */


/*
   Video inicial
*/

reproducir(
  "video01.mp4"
);


/*
   Primera consulta
*/

consultar();


/*
   Consultar cada 3 segundos
*/

setInterval(
  consultar,
  3000
);


/* =========================================================
   LOOP DEL VIDEO
   ========================================================= */

player.addEventListener(
  "ended",
  function() {

    player.currentTime = 0;

    player.play().catch(
      function() {}
    );

  }
);


</script>


</body>

</html>
